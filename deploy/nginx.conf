# Static hosting for Baker's Bench.
#
# The app makes no network requests at runtime — no fonts, no CDNs, no
# analytics — so the CSP can be extremely tight. If a future change needs an
# external resource, that policy is the thing to revisit first.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "no-referrer"      always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'self'; base-uri 'none'" always;

    gzip              on;
    gzip_types        text/css application/javascript image/svg+xml application/json;
    gzip_min_length   512;

    # HTML is the entry point and must never be served stale.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Assets are unversioned, so revalidate rather than cache blindly. ETags
    # make that cheap — a 304 costs a round trip and no body.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
        etag on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here should ever be listed or written.
    autoindex off;
    location ~ /\. { deny all; }
}
