# Static hosting for Baker's Bench.
#
# The app makes no network requests at runtime — no fonts, no CDNs, no
# analytics — so the CSP can be extremely tight. If a future change needs an
# external resource, that policy is the first thing to revisit.
#
# IMPORTANT: nginx inherits `add_header` from an outer block ONLY when the inner
# block declares none of its own. A single `add_header Cache-Control` inside a
# location therefore silently drops every security header set on the server.
# That shipped once and CI caught it. Cache-Control is now derived from the
# response content type via this map, so all headers live at exactly one level.

map $sent_http_content_type $bb_cache_control {
    default            "no-cache";
    "~*^text/html"     "no-cache, must-revalidate";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── The one and only add_header block ────────────────────────────────────
    add_header Cache-Control           $bb_cache_control  always;
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header Referrer-Policy         "no-referrer"      always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'self'; base-uri 'none'" always;

    etag on;

    gzip              on;
    gzip_types        text/css application/javascript image/svg+xml application/json;
    gzip_min_length   512;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here should ever be listed or written.
    autoindex off;
    location ~ /\. { return 404; }
}
