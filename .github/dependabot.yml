version: 2
updates:
  # The app has no runtime dependencies, so the only supply chain worth watching
  # is CI itself: the actions we run and the base images we build on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
    labels: [dependencies, docker]
