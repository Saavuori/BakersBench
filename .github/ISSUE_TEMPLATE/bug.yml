name: Bug report
description: Something is wrong — a number, a layout, a crash.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - A formula or weight looks wrong
        - Pan fit says the wrong thing
        - The schedule or timer
        - Layout or visual
        - Something else
    validations: { required: true }

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: If it is a number, tell us which bread, size, leavening and pan.
      placeholder: |
        Burger buns, Large, 8 pieces, half sheet, sourdough levain
        Expected: …
        Got: …
    validations: { required: true }

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
      description: If a published recipe disagrees with us, link it — that is the strongest kind of bug report.

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 130 on Windows 11
