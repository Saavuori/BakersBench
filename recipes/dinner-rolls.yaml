# Soft dinner rolls
#
# Percentages are baker's percentages: every ingredient is a share of
# total flour, so the flours always add up to 100.

order: 80
id: dinner-rolls
name: Soft dinner rolls
short: Dinner rolls
family: Enriched · soft
unit:
  one: roll
  many: rolls

blurb: >
  Milk, butter and egg for a tender crumb. Proof them until the sides kiss
  and they tear apart in a sheet.

links:
  - label: Soft Dinner Rolls
    source: King Arthur Baking
    url: https://www.kingarthurbaking.com/recipes/soft-dinner-rolls-recipe

# ---- Formula ----
flours:
  - name: Bread flour
    pct: 100
liquids:
  - name: Whole milk
    pct: 62
    water: 0.87
  - name: Egg
    pct: 10
    water: 0.75
others:
  - name: Butter, soft
    pct: 12
    kind: fat
    water: 0.16
  - name: Sugar
    pct: 8
    kind: sugar
    water: 0
  - name: Fine sea salt
    pct: 2
    kind: salt

yeast:
  # Always the INSTANT yeast figure. Other leavenings convert from it.
  instant_pct: 1.5

leavening:
  default: instant
  prefermented_flour:
    levain: 0.2
    poolish: 0.25
    biga: 0.25

# ---- Shape and size ----
shape:
  type: round
  spread: 0.95
  gap: 0
  can_touch: true
  touch_default: true
  gap_when_separate: 2.5

sizes:
  - id: std
    label: Standard
    g: 50
    default: true
  - id: large
    label: Large
    g: 65

counts:
  quick: [6, 12, 24]

# ---- Timing ----
schedule:
  mix: 20
  bulk: 75
  shape: 20
  proof: 55

bake:
  temp: 190°C
  time: 17–20 min
  steam: None. Brush with butter the second they come out.
  internal: 88–91°C
  minutes: 19
  stages:
    - label: Bake
      min: 18
